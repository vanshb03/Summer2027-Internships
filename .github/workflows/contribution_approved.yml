name: Contribution Approved

on:
  issues:
    types: ["labeled"]

concurrency: add_internships

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'approved'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: execute contribution_approved.py
        id: python_script
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GOLINKS_CREATE_SECRET: ${{ secrets.GOLINKS_CREATE_SECRET }}
        run: python .github/scripts/contribution_approved.py "$GITHUB_EVENT_PATH"

      - name: execute update_readmes.py
        id: python_script_readme
        run: python .github/scripts/update_readmes.py

      - name: commit files
        if: success()
        # Issue text reaches the shell only through env, never pasted into the script.
        env:
          COMMIT_EMAIL: ${{ steps.python_script.outputs.commit_email }}
          COMMIT_USERNAME: ${{ steps.python_script.outputs.commit_username }}
          COMMIT_MESSAGE: ${{ steps.python_script.outputs.commit_message }}
        run: |
          git config --local user.email "$COMMIT_EMAIL"
          git config --local user.name "$COMMIT_USERNAME"
          git add .github/scripts/listings.json
          git add README.md
          git diff-index --quiet HEAD || (git commit -a -m "$COMMIT_MESSAGE" --allow-empty)

      - name: push changes
        if: success()
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: dev

      - name: Auto Close Issue
        run: gh issue close --comment "Your contribution was accepted. Auto-closing issue" ${{ github.event.issue.number }}
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Problem With Action
        run: gh issue comment ${{ github.event.issue.number }} --body "There was an error with our github action. Error - $ERROR $README_ERROR"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERROR: ${{ steps.python_script.outputs.error_message }}
          README_ERROR: ${{ steps.python_script_readme.outputs.error_message }}
